name: garmin-gateway

services:
  garmin-gateway:
    image: nem0oo/garmin-gateway:latest
    build: .
    container_name: garmin-gateway
    restart: unless-stopped
    environment:
      MCP_API_KEY: ${MCP_API_KEY:?MCP_API_KEY is required}
      REST_API_KEY: ${REST_API_KEY:?REST_API_KEY is required}
      GARMIN_PERSONAL_API_KEY: ${GARMIN_PERSONAL_API_KEY:?GARMIN_PERSONAL_API_KEY is required}
      DOMAIN: ${VIRTUAL_HOST:?VIRTUAL_HOST is required}
      GARMIN_TOKEN_STORE: /data/garmin_tokens.json
      PORT: "8001"
      # nginx-proxy / acme-companion
      VIRTUAL_HOST: ${VIRTUAL_HOST}
      VIRTUAL_PORT: "8001"
      LETSENCRYPT_HOST: ${VIRTUAL_HOST}
    # Runs as the host user owning ./garmin_tokens, so the token file stays editable without sudo.
    user: "${PUID:-1000}:${PGID:-1000}"
    volumes:
      - ./garmin_tokens:/data
    # No `ports:` on purpose: only reachable through nginx-proxy on the shared network.
    expose:
      - "8001"
    networks:
      - frontend
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # Measured: ~55 MiB idle (garminconnect loaded), FIT decoding costs ~30x the FIT size
    # (3 h ride ~1.5 MB -> ~45 MiB, 6 h ~90 MiB). 384m covers long rides and two concurrent decodes.
    mem_limit: 384m
    pids_limit: 100
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

networks:
  frontend:
    name: reseau_interne
    external: true
